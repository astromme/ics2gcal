<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICS to Google Calendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>ICS to Google Calendar</h1>
      <p class="version">v0.1.0</p>
    </div>

    <div class="content">
      <div class="info-section">
        <h2>How to use:</h2>
        <ol>
          <li>Visit <a href="https://calendar.google.com" target="_blank">Google Calendar</a></li>
          <li>Drag and drop an .ics file onto the calendar</li>
          <li>Events will be automatically created</li>
        </ol>
      </div>

      <div class="status-section">
        <h2>Status:</h2>
        <div id="auth-status" class="status-item">
          <span class="status-label">Authentication:</span>
          <span id="auth-status-value" class="status-value">Checking...</span>
        </div>
      </div>

      <div class="actions">
        <button id="auth-btn" class="primary-btn">Authenticate with Google</button>
      </div>
    </div>

    <div class="footer">
      <p>Drag and drop .ics files on Google Calendar to add events</p>
    </div>
  </div>

  <script src="popup.ts" type="module"></script>
</body>
</html>
